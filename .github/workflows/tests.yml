name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl quickjs ruff
      - run: python -m py_compile app.py wiki_lookup.py checks.py tomes.py
      - run: ruff check --select E9,F63,F7,F82 app.py wiki_lookup.py checks.py tomes.py tests/
      - run: python checks.py
      - run: python -m unittest discover tests -v
